openapi: 3.0.0
info:
    title: Base API
    version: 1.0.0
    contact:
        name: Spryker
        email: support@spryker.com
servers:
    - url: http://base.local
tags:
    - name: Base
      description: Base endpoints
paths:
    /base-resource:
        get:
            tags:
                - Base
            responses:
                '200':
                    description: ok
components:
    schemas:
        BaseOnly:
            type: object
            properties:
                id:
                    type: string
        SharedIdentical:
            type: object
            properties:
                id:
                    type: string
        SharedDifferent:
            type: object
            properties:
                base_only_field:
                    type: string
    securitySchemes:
        BaseAuth:
            type: http
            scheme: bearer
    parameters: {}
